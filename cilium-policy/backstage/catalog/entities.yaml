apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: community-platform
  description: Team operating the resource fulfillment platform
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: community-resource-fulfillment
  description: Accepts, reserves, and fulfills requests for community resources
spec:
  owner: group:default/community-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: request-coordinator
  description: Public workflow API for resource requests
  annotations:
    backstage.io/kubernetes-id: request-coordinator
    backstage.io/kubernetes-namespace: applications
    backstage.io/source-location: url:https://github.com/runtimeconditions/rc-demos/tree/main/cilium-policy/apps/resource-demo/services/request-coordinator
spec:
  type: service
  lifecycle: experimental
  owner: group:default/community-platform
  system: community-resource-fulfillment
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: inventory-service
  description: Owns item availability and durable reservations
  annotations:
    backstage.io/kubernetes-id: inventory-service
    backstage.io/kubernetes-namespace: applications
spec:
  type: service
  lifecycle: experimental
  owner: group:default/community-platform
  system: community-resource-fulfillment
  providesApis:
    - inventory-api
  dependsOn:
    - resource:default/resource-database
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: fulfillment-service
  description: Creates and tracks delivery work
  annotations:
    backstage.io/kubernetes-id: fulfillment-service
    backstage.io/kubernetes-namespace: applications
spec:
  type: service
  lifecycle: experimental
  owner: group:default/community-platform
  system: community-resource-fulfillment
  providesApis:
    - fulfillment-api
  dependsOn:
    - resource:default/resource-database
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: notification-worker
  description: Records notifications from fulfillment events
  annotations:
    backstage.io/kubernetes-id: notification-worker
    backstage.io/kubernetes-namespace: applications
spec:
  type: service
  lifecycle: experimental
  owner: group:default/community-platform
  system: community-resource-fulfillment
  dependsOn:
    - resource:default/resource-database
    - resource:default/event-bus
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: donor-directory
  description: Unrelated API included to make capability matching meaningful
  annotations:
    backstage.io/kubernetes-id: donor-directory
    backstage.io/kubernetes-namespace: applications
spec:
  type: service
  lifecycle: experimental
  owner: group:default/community-platform
  system: community-resource-fulfillment
  providesApis:
    - donor-directory-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: inventory-api
  description: Availability and reservation capabilities
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/community-platform
  system: community-resource-fulfillment
  definition: |
    openapi: 3.0.3
    info:
      title: Inventory API
      version: 1.0.0
    paths:
      /items/{itemId}/availability:
        get:
          operationId: getItemAvailability
          parameters:
            - name: itemId
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Current available quantity
              content:
                application/json:
                  schema:
                    type: object
                    required: [itemId, available]
                    properties:
                      itemId:
                        type: string
                      available:
                        type: integer
      /reservations:
        post:
          operationId: createReservation
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [requestId, itemId, quantity]
                  properties:
                    requestId:
                      type: string
                    itemId:
                      type: string
                    quantity:
                      type: integer
                      minimum: 1
          responses:
            "201":
              description: Reservation created
            "409":
              description: Insufficient stock
      /admin/items:
        post:
          operationId: createInventoryItem
          responses:
            "201":
              description: Item created
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: fulfillment-api
  description: Durable fulfillment task capabilities
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/community-platform
  system: community-resource-fulfillment
  definition: |
    openapi: 3.0.3
    info:
      title: Fulfillment API
      version: 1.0.0
    paths:
      /fulfillment-tasks:
        post:
          operationId: createFulfillmentTask
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [requestId, itemId, quantity]
                  properties:
                    requestId:
                      type: string
                    itemId:
                      type: string
                    quantity:
                      type: integer
          responses:
            "201":
              description: Task created
      /fulfillment-tasks/{taskId}:
        get:
          operationId: getFulfillmentTask
          responses:
            "200":
              description: Task state
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: donor-directory-api
  description: A catalog decoy that must not match the profile
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/community-platform
  system: community-resource-fulfillment
  definition: |
    openapi: 3.0.3
    info:
      title: Donor Directory API
      version: 1.0.0
    paths:
      /donors/{donorId}:
        get:
          operationId: getDonor
          responses:
            "200":
              description: Donor record
      /donors/search:
        post:
          operationId: searchDonors
          responses:
            "200":
              description: Matching donors
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: resource-database
  description: Shared demo PostgreSQL instance
  annotations:
    backstage.io/kubernetes-id: resource-database
    backstage.io/kubernetes-namespace: dependencies
    demo.platform.io/interface: relational
    demo.platform.io/engine: postgres
spec:
  type: database
  owner: group:default/community-platform
  system: community-resource-fulfillment
  dependencyOf:
    - component:default/request-coordinator
    - component:default/inventory-service
    - component:default/fulfillment-service
    - component:default/notification-worker
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: availability-cache
  description: Persistent Redis cache used by the coordinator
  annotations:
    backstage.io/kubernetes-id: availability-cache
    backstage.io/kubernetes-namespace: dependencies
    demo.platform.io/interface: key_value
    demo.platform.io/engine: redis
spec:
  type: cache
  owner: group:default/community-platform
  system: community-resource-fulfillment
  dependencyOf:
    - component:default/request-coordinator
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: event-bus
  description: NATS cluster used for fulfillment events
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=event-bus
    backstage.io/kubernetes-namespace: dependencies
    demo.platform.io/interface: service
    demo.platform.io/engine: nats
spec:
  type: message-broker
  owner: group:default/community-platform
  system: community-resource-fulfillment
  dependencyOf:
    - component:default/request-coordinator
    - component:default/notification-worker
