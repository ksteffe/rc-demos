openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
paths:
  /items/{itemId}/availability:
    get:
      operationId: getItemAvailability
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current available quantity
          content:
            application/json:
              schema:
                type: object
                required: [itemId, available]
                properties:
                  itemId:
                    type: string
                  available:
                    type: integer
  /reservations:
    post:
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, itemId, quantity]
              properties:
                requestId:
                  type: string
                itemId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Reservation created
        "409":
          description: Insufficient stock
  /admin/items:
    post:
      operationId: createInventoryItem
      responses:
        "201":
          description: Item created

