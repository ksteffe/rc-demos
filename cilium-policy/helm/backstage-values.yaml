backstage:
  image:
    registry: ghcr.io
    repository: backstage/backstage
    tag: "1.53.0"
  extraVolumes:
    - name: demo-catalog
      configMap:
        name: backstage-demo-catalog
  extraVolumeMounts:
    - name: demo-catalog
      mountPath: /app/catalog
      readOnly: true
  appConfig:
    app:
      # The chart passes only this file to the backend, so it replaces the
      # image's own app-config rather than layering onto it.
      packages: all
      title: Runtime Conditions Demo Catalog
      baseUrl: http://localhost:7007
    organization:
      name: Runtime Conditions
    backend:
      baseUrl: http://localhost:7007
      listen:
        port: 7007
      auth:
        dangerouslyDisableDefaultAuthPolicy: true
      cors:
        origin: http://localhost:7007
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
    permission:
      enabled: false
    catalog:
      # Group is absent from the default allow-list, and one rejected kind
      # discards every entity the location emitted, not just that one.
      rules:
        - allow: [Component, System, API, Resource, Location, Group]
      locations:
        - type: file
          target: /app/catalog/all.yaml
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: rc-cilium
              url: https://kubernetes.default.svc.cluster.local
              authProvider: serviceAccount
              skipMetricsLookup: true

postgresql:
  enabled: true
  auth:
    username: backstage
    password: backstage-demo-only
    database: backstage
    # The subchart writes these key names but the parent chart's defaults point
    # its read-back lookup at existingSecret key names, so every upgrade after
    # the initial install fails on the key it never wrote.
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

serviceAccount:
  create: true
  name: backstage
  automountServiceAccountToken: true
