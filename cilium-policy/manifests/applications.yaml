apiVersion: v1
kind: Service
metadata:
  name: intake-gateway-v1
  namespace: applications
  labels:
    backstage.io/kubernetes-id: request-coordinator
spec:
  selector:
    app.kubernetes.io/name: request-coordinator
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-coordinator
  namespace: applications
  labels:
    backstage.io/kubernetes-id: request-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: request-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: request-coordinator
        backstage.io/kubernetes-id: request-coordinator
        network.runtimeconditions.io/plane: data
    spec:
      containers:
        - name: service
          image: localhost/rc-resource-demo:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_ROLE
              value: request
            - name: INVENTORY_URL
              value: http://stock-provider-v2.applications.svc.cluster.local:8080
            - name: FULFILLMENT_URL
              value: http://dispatch-planner-v1.applications.svc.cluster.local:8080
            - name: DATABASE_URL
              value: postgres://resources:local-demo-only@resource-records-v1.dependencies.svc.cluster.local:5432/resources?sslmode=disable
            - name: REDIS_HOST
              value: availability-cache-v1.dependencies.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: NATS_URL
              value: nats://event-bus-nats.dependencies.svc.cluster.local:4222
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
