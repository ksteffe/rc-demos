apiVersion: v1
kind: Secret
metadata:
  name: resource-database
  namespace: dependencies
type: Opaque
stringData:
  POSTGRES_DB: resources
  POSTGRES_USER: resources
  POSTGRES_PASSWORD: local-demo-only
---
apiVersion: v1
kind: Service
metadata:
  name: resource-records-v1
  namespace: dependencies
  labels:
    backstage.io/kubernetes-id: resource-database
spec:
  selector:
    app.kubernetes.io/name: resource-database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resource-database
  namespace: dependencies
  labels:
    backstage.io/kubernetes-id: resource-database
spec:
  serviceName: resource-records-v1
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resource-database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resource-database
        backstage.io/kubernetes-id: resource-database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: resource-database
          readinessProbe:
            exec:
              command: [pg_isready, -U, resources]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: availability-cache-v1
  namespace: dependencies
  labels:
    backstage.io/kubernetes-id: availability-cache
spec:
  selector:
    app.kubernetes.io/name: availability-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: availability-cache
  namespace: dependencies
  labels:
    backstage.io/kubernetes-id: availability-cache
spec:
  serviceName: availability-cache-v1
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: availability-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: availability-cache
        backstage.io/kubernetes-id: availability-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: [redis-server, --appendonly, "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

